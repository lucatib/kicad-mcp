name: CI

# discovery.InstallResolver has one implementation per platform; the unit tier
# runs each of them on every OS against fake install trees.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The unit tier must pass with no KiCad installed -- that constraint is
      # what makes CI viable at all. Tests needing KiCad are marked
      # `requires_kicad` and are deselected here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q -m "not requires_kicad and not requires_running_kicad"
