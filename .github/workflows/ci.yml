name: CI

# Windows-only by design: the server targets KiCad on Windows and
# discovery.InstallResolver has a single Windows implementation.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The unit tier must pass with no KiCad installed -- that constraint is
      # what makes CI viable at all. Tests needing KiCad are marked
      # `requires_kicad` and are deselected here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q -m "not requires_kicad and not requires_running_kicad"
