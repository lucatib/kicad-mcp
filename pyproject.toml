[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kicad-mcp"
version = "0.2.0"
description = "MCP server for KiCad 10 — live PCB access, schematic reading, and schematic generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3",
    "kicad-python>=0.7.1",
    "olefile>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6"]

[project.scripts]
kicad-mcp = "kicad_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The slow tests import a 12 MB Altium board end to end; run them with
# `pytest -m slow`. A later -m on the command line replaces this one.
# -n auto runs the suite on up to 8 processes (tests/conftest.py caps it): it
# mostly waits on kicad-cli. Pass -n0 to run in one process, e.g. to debug.
addopts = "-m 'not slow' -n auto"
markers = [
    "requires_kicad: needs a KiCad installation present",
    "requires_running_kicad: needs KiCad running with the IPC server enabled",
    "slow: large downloaded fixtures or long kicad-cli runs",
]
